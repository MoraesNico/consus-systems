<div class="barra-progresso{% if compacto %} barra-progresso--compacta{% endif %}" role="meter" aria-label="{{ rotulo }}" aria-valuenow="{{ valor|unlocalize }}" aria-valuemin="0" aria-valuemax="{{ maximo|unlocalize }}" aria-valuetext="{% if sufixo %}{{ valor }}{{ sufixo }}{% else %}{{ valor }} de {{ maximo }}{% endif %}">
  <div class="barra-progresso__textos">{% if not compacto %}<span>{{ rotulo }}</span>{% endif %}<span class="barra-progresso__valor">{% if sufixo %}{{ valor }}{{ sufixo }}{% else %}{{ valor }} / {{ maximo }}{% endif %}</span></div>
  <div class="barra-progresso__trilha" aria-hidden="true"><div class="barra-progresso__preenchimento tom--{{ tom|default:'acento' }}" style="--valor: {{ valor|porcentagem:maximo }}"></div></div>
</div>
