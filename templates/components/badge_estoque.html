{% if situacao == "ok" %}<span class="badge badge--ok" role="img" aria-label="Situação: OK">{% icone "circle-check" %}OK</span>{% elif situacao == "reposicao" %}<span class="badge badge--reposicao" role="img" aria-label="Situação: reposição necessária">{% icone "triangle-alert" %}REPOSIÇÃO NECESSÁRIA</span>{% elif situacao == "sem_estoque" %}<span class="badge-composto" role="img" aria-label="Situação: reposição necessária, sem estoque"><span class="badge badge--reposicao">{% icone "triangle-alert" %}REPOSIÇÃO NECESSÁRIA</span><span class="badge badge--sem-estoque">{% icone "octagon-x" %}SEM ESTOQUE</span></span>{% endif %}
