[project]
name = "consus"
version = "0.1.0"
description = "Consus — Controle de Estoque Simples (Django + HTMX)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "django-htmx>=1.23",
    "dj-database-url>=2.3",
    "psycopg[binary]>=3.2",
    "gunicorn>=23",
    "whitenoise>=6.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["**/migrations/**", "specs", "docs", ".specify", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tabela espelho do design system: uma linha por par facilita a revisão.
"apps/core/design_tokens.py" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["apps"]
python_files = ["test_*.py"]
addopts = '-m "not docker" --cov --cov-report=term-missing:skip-covered'
filterwarnings = ["ignore:No directory at:UserWarning"]
markers = [
    "docker: integração com Docker Compose (opt-in, `pytest -m docker`)",
    "postgres: exige PostgreSQL (pulado automaticamente no SQLite)",
]

[tool.coverage.run]
source = ["apps", "config"]
branch = true
omit = ["*/tests/*", "*/migrations/*", "config/asgi.py", "config/wsgi.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
