<form id="filtros" class="filtros" method="get" action="{% url 'movimentacoes:lista' %}" role="search" hx-get="{% url 'movimentacoes:lista' %}" hx-target="#resultados" hx-swap="outerHTML" hx-push-url="true" hx-trigger="change, submit">
  <div class="campo campo--sm"><label class="campo__rotulo" for="{{ filtros_form.produto.id_for_label }}">Produto</label><span class="campo__select">{{ filtros_form.produto }}{% icone "chevron-down" %}</span></div>
  <div class="campo campo--sm"><label class="campo__rotulo" for="{{ filtros_form.tipo.id_for_label }}">Tipo</label><span class="campo__select">{{ filtros_form.tipo }}{% icone "chevron-down" %}</span></div>
  <div class="campo campo--sm"><label class="campo__rotulo" for="{{ filtros_form.de.id_for_label }}">De</label>{{ filtros_form.de }}</div>
  <div class="campo campo--sm"><label class="campo__rotulo" for="{{ filtros_form.ate.id_for_label }}">Até</label>{{ filtros_form.ate }}</div>
  <div class="cluster filtros__acoes"><button class="botao botao--secundario botao--sm" type="submit">Filtrar</button><a class="botao botao--fantasma botao--sm" href="{% url 'movimentacoes:lista' %}">Limpar</a></div>
</form>
