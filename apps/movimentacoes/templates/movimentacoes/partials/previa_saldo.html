<output id="previa-saldo" class="previa-saldo{% if previa.alerta %} previa-saldo--alerta{% endif %}" aria-live="polite" hx-get="{% url 'movimentacoes:nova' %}" hx-include="closest form" hx-target="this" hx-swap="outerHTML" hx-trigger="input changed delay:300ms from:closest form, change from:closest form" data-silencioso>{% if previa.alerta %}{% icone "triangle-alert" %}{% endif %}<span>{{ previa.texto }}</span></output>
