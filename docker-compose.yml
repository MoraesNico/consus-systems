# Consus — `cp .env.example .env && docker compose up --build` → http://localhost:8000
services:
  db:
    image: postgres:17-alpine
    env_file:
      - path: ${CONSUS_ENV_FILE:-.env}
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-consus}
      POSTGRES_USER: ${POSTGRES_USER:-consus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-consus}
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      target: producao
    image: consus-app:latest
    env_file:
      - path: ${CONSUS_ENV_FILE:-.env}
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://consus:consus@db:5432/consus}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-troque-esta-chave-antes-de-publicar}
    ports:
      - "${CONSUS_PORTA:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/saude/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  testes:
    profiles: ["testes"]
    build:
      context: .
      target: testes
    image: consus-testes:latest
    env_file:
      - path: ${CONSUS_ENV_FILE:-.env}
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://consus:consus@db:5432/consus}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-troque-esta-chave-antes-de-publicar}
      DJANGO_DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
    command: ["pytest"]

volumes:
  dados_postgres: {}
